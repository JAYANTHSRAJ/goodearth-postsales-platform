databaseChangeLog:
  - changeSet:
      id: 3.21-create-zoho-sign-requests-table
      author: goodearth-platform
      changes:
        - createTable:
            tableName: zoho_sign_requests
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: request_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: workflow_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: document_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: zoho_sign_requests
            baseColumnNames: workflow_id
            referencedTableName: workflows
            referencedColumnNames: id
            constraintName: fk_sign_requests_workflow
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: zoho_sign_requests
            baseColumnNames: document_id
            referencedTableName: documents
            referencedColumnNames: id
            constraintName: fk_sign_requests_document
            onDelete: SET NULL
        - createIndex:
            indexName: idx_zoho_sign_requests_request_id
            tableName: zoho_sign_requests
            columns:
              - column:
                  name: request_id
        - createIndex:
            indexName: idx_zoho_sign_requests_workflow_id
            tableName: zoho_sign_requests
            columns:
              - column:
                  name: workflow_id
