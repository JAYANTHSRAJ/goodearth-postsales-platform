databaseChangeLog:
  - changeSet:
      id: 3.26-add-reset-password-fields-to-users
      author: antigravity
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: reset_password_token
                  type: VARCHAR(255)
              - column:
                  name: reset_password_token_expiry
                  type: TIMESTAMP
