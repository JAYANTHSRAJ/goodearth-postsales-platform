databaseChangeLog:
  - changeSet:
      id: 3.20-create-offer-letter-audits-table
      author: antigravity
      changes:
        - createTable:
            tableName: offer_letter_audits
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: booking_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: deal_record_id
                  type: VARCHAR(100)
              - column:
                  name: sent
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: TIMESTAMP
              - column:
                  name: sent_by
                  type: VARCHAR(100)
              - column:
                  name: recipient_email
                  type: VARCHAR(150)
              - column:
                  name: recipient_name
                  type: VARCHAR(150)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
