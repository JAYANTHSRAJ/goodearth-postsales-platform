databaseChangeLog:
  - changeSet:
      id: 3.23-add-project-name
      author: antigravity
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: workdrive_folders
            columnName: project_name
      changes:
        - addColumn:
            tableName: workdrive_folders
            columns:
              - column:
                  name: project_name
